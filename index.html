<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LKK</title>
  <style>
    :root { --orange: #ff7a18; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      background: #050505;
      font-family: Impact, Haettenschweiler, "Arial Black", sans-serif;
    }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
    .mark {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      opacity: 0;
      animation: reveal 1.8s cubic-bezier(.16,.75,.25,1) 1.25s forwards;
      color: var(--orange);
      font-size: clamp(7rem, 24vw, 22rem);
      line-height: .72;
      letter-spacing: clamp(-1.8rem, -1.5vw, -.5rem);
      text-transform: uppercase;
      text-shadow:
        0 0 4px #ff9a3c,
        0 0 18px rgba(255, 122, 24, .7),
        7px 7px 0 rgba(255, 92, 0, .18);
      filter: drop-shadow(0 0 12px rgba(255, 122, 24, .25));
      user-select: none;
    }
    .mark::after {
      content: "";
      position: absolute;
      width: min(74vw, 920px);
      height: 3px;
      bottom: calc(50% - clamp(4.1rem, 12vw, 11rem));
      background: linear-gradient(90deg, transparent, var(--orange), transparent);
      box-shadow: 0 0 12px var(--orange);
      transform: scaleX(0);
      animation: line 1.2s ease-out 2.1s forwards;
    }
    @keyframes reveal {
      0% { opacity: 0; transform: scale(.82); letter-spacing: .8rem; filter: blur(10px); }
      55% { opacity: 1; transform: scale(1.025); filter: blur(0); }
      100% { opacity: 1; transform: scale(1); letter-spacing: clamp(-1.8rem, -1.5vw, -.5rem); }
    }
    @keyframes line { to { transform: scaleX(1); } }
    @media (prefers-reduced-motion: reduce) {
      .mark { opacity: 1; animation: none; }
      .mark::after { transform: scaleX(1); animation: none; }
    }
  </style>
</head>
<body>
  <canvas id="rain" aria-hidden="true"></canvas>
  <div class="mark" aria-label="LKK">LKK</div>
  <script>
    const canvas = document.querySelector('#rain');
    const ctx = canvas.getContext('2d');
    let width, height, dpr;
    let drops = [];

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const count = Math.max(24, Math.floor(width / 26));
      drops = Array.from({ length: count }, (_, i) => ({
        x: (i + .5) * width / count + (Math.random() - .5) * 12,
        y: Math.random() * height,
        speed: 1.8 + Math.random() * 5,
        length: 18 + Math.random() * 70,
        alpha: .18 + Math.random() * .55
      }));
    }

    function draw() {
      ctx.fillStyle = 'rgba(5, 5, 5, 0.16)';
      ctx.fillRect(0, 0, width, height);
      for (const drop of drops) {
        const gradient = ctx.createLinearGradient(drop.x, drop.y - drop.length, drop.x, drop.y);
        gradient.addColorStop(0, 'rgba(255, 122, 24, 0)');
        gradient.addColorStop(1, `rgba(255, 122, 24, ${drop.alpha})`);
        ctx.beginPath();
        ctx.moveTo(drop.x, drop.y - drop.length);
        ctx.lineTo(drop.x, drop.y);
        ctx.strokeStyle = gradient;
        ctx.lineWidth = 1;
        ctx.stroke();
        drop.y += drop.speed;
        if (drop.y - drop.length > height) {
          drop.y = -Math.random() * 180;
          drop.speed = 1.8 + Math.random() * 5;
          drop.length = 18 + Math.random() * 70;
        }
      }
      requestAnimationFrame(draw);
    }

    resize();
    window.addEventListener('resize', resize);

    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      ctx.fillStyle = '#050505';
      ctx.fillRect(0, 0, width, height);
    } else {
      draw();
    }
  </script>
</body>
</html>
